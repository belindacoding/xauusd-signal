name: XAUUSD Daily Signal
on:
  schedule:
    - cron: '7 21 * * 1-5'    # 17:07 ET in summer (EDT); pre-close in winter -> script self-gates
    - cron: '7 22 * * 1-5'    # 17:07 ET in winter (EST); 18:07 in summer -> deduped if already posted
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas numpy requests
      - name: compute signal
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
        run: |
          set -o pipefail
          python daily_signal.py --capital 100000 --lev 1.5 | tee signal.txt
      - name: log and notify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -q SESSION_INCOMPLETE_SKIP signal.txt && { echo "session not closed yet, skipping"; exit 0; }
          MAIN=$(grep -oP '(?<=GRIND MOMENTUM \(primary\): )\w+' signal.txt || echo UNKNOWN)
          DATE=$(grep -oP '(?<=session close )\S+' signal.txt || date -u +%F)
          [ -f "signals/${DATE}.txt" ] && { echo "already posted for ${DATE}, skipping"; exit 0; }
          mkdir -p signals && cp signal.txt "signals/${DATE}.txt"
          git config user.name signal-bot
          git config user.email signal-bot@users.noreply.github.com
          git add signals && (git commit -m "signal ${DATE}: ${MAIN}" && git push) || true
          gh issue create \
            --title "XAUUSD 信号 ${DATE}: ${MAIN}" \
            --body "$(cat signal.txt)" \
            --assignee "${{ github.repository_owner }}"
      - name: notify failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "XAUUSD 信号 $(date -u +%F): UNAVAILABLE ⚠️" \
            --body "信号生成失败——保持昨日仓位不变。详见 Actions 日志。" \
            --assignee "${{ github.repository_owner }}"
